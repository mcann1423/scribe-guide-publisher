name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Install build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Bundle self-contained application
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --windowed --collect-all playwright --name "Help Guide Publisher" app.py
      - name: Smoke-test packaged Edge automation
        shell: pwsh
        run: '& ".\dist\Help Guide Publisher\Help Guide Publisher.exe" --browser-self-test'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Compile installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\HelpGuidePublisher.iss'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelpGuidePublisherSetup
          path: installer-output/HelpGuidePublisherSetup.exe
          if-no-files-found: error
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installer-output/HelpGuidePublisherSetup.exe
